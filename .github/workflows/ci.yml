name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # typecheck + tests + production build.
      # No API key is configured here on purpose: the pipeline renders through
      # the offline provider, so CI never touches a paid endpoint.
      - run: npm run verify
