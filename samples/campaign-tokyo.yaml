# A market the bundled typefaces cannot render.
#
# Localization is the exercise's bonus and the font files are its honest limit.
# Rubik and Cormorant Garamond cover Latin and its accents; Japanese has no
# glyphs in either, so this copy would rasterize as .notdef boxes.
#
# Nothing downstream would notice. The ink check counts opaque pixels and a row
# of tofu is opaque, so every check would pass and the creative would ship
# looking like a bug in the brand's advertising.
#
# So preflight refuses it, names the market and shows the characters:
#   npm run campaign -- samples/campaign-tokyo.yaml
#
# The fix is a real one, not a code change: drop a CJK face into assets/fonts
# and set brand.headlineFont. That is exactly what a client onboarding a new
# market would have to do.
id: lumen-tokyo
name: Lumen Botanicals - Tokyo launch

region: Japan
audience: Urban professionals 28-45 in Tokyo who buy dermatologist-tested skincare
message: Wake up to visibly brighter skin
callToAction: Discover now

markets:
  - locale: en-GB
    name: United Kingdom
    message: Wake up to visibly brighter skin
    callToAction: Discover now

  - locale: ja-JP
    name: Japan
    message: 朝、明るい肌へ
    callToAction: 詳しく見る
    disclaimer: 効果には個人差があります。

brand:
  name: Lumen Botanicals
  logoPath: samples/assets/lumen-logo.png
  primaryColor: "#14322B"
  secondaryColor: "#C9A227"
  prohibitedWords: [cure, miracle, clinically proven]

products:
  - id: radiance-serum
    name: Radiance Vitamin C Serum
    approvedHeroPath: samples/assets/radiance-serum-hero.png
  - id: overnight-recovery-cream
    name: Overnight Recovery Cream
    approvedHeroPath: samples/assets/overnight-cream-packshot.png
