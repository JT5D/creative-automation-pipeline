# A second brand, a different category, and a different set.
#
# Nothing in the pipeline knows what a skincare campaign is. This brief exists
# to prove that: same schema, same run, no code path is category-aware. The
# only thing that changes is the data.

id: nordisk-brew-harvest
name: Nordisk Brew - Single Origin Harvest

region: Nordics (SE/DK/NO)
audience: Home baristas 25-44 who buy single-origin beans and brew by hand
message: Roasted the morning it ships
objective: Convert first-time subscribers to the single-origin rotation
callToAction: Start the rotation
toneOfVoice: Quiet, precise, Scandinavian. Craft without ceremony.

manualMinutesPerCreative: 20
manualHourlyRateUsd: 85

# One word. `nordic` sets the light flat and cool, the set to pale ash wood, and
# the grade to cool neutrals - which is what this brief was reaching for by
# describing the set and hoping the light would follow.
look: nordic

markets:
  - locale: en-GB
    name: United Kingdom
    message: Roasted the morning it ships
    callToAction: Start the rotation
    disclaimer: Subscription renews monthly. Cancel anytime.

  - locale: sv-SE
    name: Sweden
    message: Rostat samma morgon som det skickas
    callToAction: Börja prenumerera
    disclaimer: Prenumerationen förnyas månadsvis. Avbryt när som helst.

  # The brief says Nordics (SE/DK/NO) and shipped Sweden only, which made the
  # region field a claim the campaign did not honour. Each market costs nothing
  # extra: the hero is generated once and localized copy is composited per
  # market, so this is four markets for the same two generations.
  - locale: da-DK
    name: Denmark
    message: Ristet samme morgen som den sendes
    callToAction: Start abonnementet
    disclaimer: Abonnementet fornys månedligt. Opsig når som helst.

  - locale: nb-NO
    name: Norway
    message: Brent samme morgen som den sendes
    callToAction: Start abonnementet
    disclaimer: Abonnementet fornyes månedlig. Si opp når som helst.

brand:
  name: Nordisk Brew
  logoPath: samples/assets/nordisk-brew-logo.png
  primaryColor: "#1F2A24"
  secondaryColor: "#B87333"
  disclaimer: Subscription renews monthly. Cancel anytime.
  prohibitedWords:
    - healthiest
    - cures
    - guaranteed
    - miracle
    - detox

products:
  - id: ethiopia-guji
    name: Ethiopia Guji Whole Bean
  - id: colombia-huila
    name: Colombia Huila Whole Bean
