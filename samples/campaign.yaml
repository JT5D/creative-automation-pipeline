# Campaign brief - the single input to the pipeline.
# JSON is accepted too; both normalize to the same validated object.

id: lumen-autumn-glow-de
name: Lumen Botanicals - Autumn Glow (DACH)

# Who / what / why / where / success. The same fields the public AMA creative
# brief template names: audience, objective, message, tone, mandatory elements.
region: Germany (DACH)                    # WHERE
audience: Urban professionals 28-45 who buy dermatologist-tested, clean-formula skincare   # WHO
message: Wake up to visibly brighter skin # WHAT - the single-minded proposition
objective: Drive first-purchase conversion for the autumn skincare range in DACH   # WHY
callToAction: Jetzt entdecken             # rendered into every creative
toneOfVoice: Calm, clinical, warm. Understated luxury - never hype.

# SUCCESS - the documented baseline for the "time saved" figure in report.json.
#
# Itemised on purpose. A single "25 minutes per creative" carries the whole
# time-saved claim and tells a reviewer nothing about whether it is credible,
# so the client states the steps and the pipeline adds them up. These are the
# client's own assumptions about their current process; nothing here is
# measured by this tool, and every figure derived from it is labelled an
# estimate. Argue with a line, not with the total.
manualBaseline:
  - task: Locate the approved hero and the market's signed-off copy
    minutes: 6
  - task: Lay the format out and fit the headline
    minutes: 7
  - task: Place localized copy and proof it for that market
    minutes: 4
  - task: Check against brand guidelines and the legal claim list
    minutes: 5
  - task: Export, name and file the asset
    minutes: 3

# The same number, stated as a total. Preflight requires the two to agree, so
# editing the list above without editing this fails the run before it spends.
manualMinutesPerCreative: 25
# Loaded studio rate. Stated by a human on purpose: without it the run
# reports time saved only, and never invents a cost.
manualHourlyRateUsd: 85

# ── Markets ──
# Every market multiplies the output and costs NOTHING extra: the hero is
# generated once, then localized copy is composited per market.
#
# Copy is supplied per market by the people accountable for it. Translation is
# deliberately data, not a runtime model call - localized claims carry legal
# weight in each jurisdiction and need human sign-off.
markets:
  - locale: en-GB
    name: United Kingdom
    message: Wake up to visibly brighter skin
    callToAction: Discover now
    disclaimer: Individual results may vary. Dermatologist tested.

  - locale: de-DE
    name: Germany
    message: Wach auf mit sichtbar strahlenderer Haut
    callToAction: Jetzt entdecken
    disclaimer: Ergebnisse können variieren. Dermatologisch getestet.

  - locale: fr-FR
    name: France
    message: Réveillez-vous avec une peau visiblement plus éclatante
    callToAction: Découvrir
    disclaimer: Les résultats peuvent varier. Testé sous contrôle dermatologique.

brand:
  name: Lumen Botanicals
  logoPath: samples/assets/lumen-logo.png
  primaryColor: "#14322B"
  secondaryColor: "#C9A227"
  disclaimer: Individual results may vary. Dermatologist tested.

  # Legal / MLR screen. These are the claims regulated markets do not allow on
  # a cosmetic, so they must never reach a rendered creative.
  prohibitedWords:
    - cure
    - cures
    - miracle
    - clinically proven
    - anti-aging
    - eliminates wrinkles
    - guaranteed
    - permanent results

products:
  # ── Product A ──
  # An approved campaign hero already exists, so the pipeline REUSES it
  # and spends nothing. Delete the file and this product takes the
  # generation path instead - the branch is a real filesystem check.
  - id: radiance-serum
    name: Radiance Vitamin C Serum
    approvedHeroPath: samples/assets/radiance-serum-hero.png

  # ── Product B ──
  # No approved hero. A packshot exists, so it is handed to the model as an
  # identity anchor: the real product is composited into a new campaign scene
  # rather than hallucinated from a text description.
  - id: overnight-recovery-cream
    name: Overnight Recovery Cream
    referenceAssetPath: samples/assets/overnight-cream-packshot.png
